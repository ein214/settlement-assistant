apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: settlement-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ein214/settlement-assistant.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: settlement
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
