name: CI

on:
  push:
    branches: [main]
    # k8s/ 수정도 검증해야 하므로 무시하지 않는다. CI의 태그 갱신 커밋은 [skip ci]로 루프를 막는다
    paths-ignore: ["**.md"]
  pull_request:

# 기본은 읽기 전용, 필요한 잡에서만 권한을 연다
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install pytest pip-audit
      - name: Test
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.lock

  manifests:
    # 잘못된 매니페스트가 Argo CD까지 가서 Sync Failed가 나기 전에 CI에서 차단
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform (checksum verified)
        run: |
          curl -sSLo kc.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tar.gz" | sha256sum -c -
          tar -xzf kc.tar.gz kubeconform
      - name: Render and validate
        run: |
          kubectl kustomize k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.34.1 rendered.yaml

  image:
    needs: [test, manifests]
    if: github.event_name == 'push'
    # 배포 대상이 Apple Silicon(arm64) 로컬 클러스터라 arm64 러너에서 네이티브 빌드
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-manifest:
    # GitOps: 이미지 태그를 k8s/에 커밋하면 클러스터 안의 Argo CD가 감지해 배포한다
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # 이 실행 이후에 자체 CI를 돌릴 새 커밋(.md 외 파일 변경)이 들어왔다면 그 CI가 더 최신 이미지를 배포한다.
            # 여기서 태그를 쓰면 옛 이미지로 되돌아가므로 건너뛴다. 문서만 바꾼 커밋은 CI가 없으므로 무시한다
            for c in $(git rev-list "${GITHUB_SHA}..origin/main"); do
              git log -1 --format=%s "$c" | grep -q '^deploy:' && continue
              if git diff-tree --no-commit-id --name-only -r "$c" | grep -qv '\.md$'; then
                echo "Newer code commit ${c::7} on main; skipping tag bump for ${GITHUB_SHA::7}"
                exit 0
              fi
            done
            sed -i "s/^\(\s*newTag:\).*/\1 sha-${GITHUB_SHA}/" k8s/kustomization.yaml
            git commit -qam "deploy: sha-${GITHUB_SHA::7} [skip ci]" || { echo "Tag already set"; exit 0; }
            # 그 사이 main이 앞서 나가 push가 거부되면 최신 main 위에서 다시 시도
            git push -q origin HEAD:main && exit 0
            echo "Push rejected (attempt ${attempt}); retrying"
            sleep $((attempt * 3))
          done
          echo "Failed to push tag bump after retries" >&2
          exit 1
